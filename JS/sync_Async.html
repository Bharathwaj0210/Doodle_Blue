<body>
    <script>
        // console.log("Start")

        // console.log("End")

        const mypromise= new Promise(function(resolve, reject){
            let paysuccess=true
            if (paysuccess){
                resolve("Payment success");
            }
            else{
                reject("Payment Failure");
            }
        })
        mypromise.then(function(result){
            console.log(result);
        })
        .catch(function(error){
            console.log(error)
        });
    </script>
