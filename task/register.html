<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - Know A Fest</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            <i class="bi bi-mortarboard-fill"></i>
            Know A Fest
        </a>

        <nav class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="schedule.html">Schedule</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="register-section">

        <h1>Event Registration</h1>
        <p class="register-subtitle">
            Fill out the form to register for an event.
        </p>

        <form class="register-form" action="#" method="post">

            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name <span>*</span></label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email <span>*</span></label>
                    <input type="email" id="email" name="email" placeholder="yourname@example.com" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number <span>*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}"
                        maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="department">Department <span>*</span></label>
                    <select id="department" name="department" required>
                        <option value="">Select department</option>
                        <option>Artificial Intelligence and Data Science</option>
                        <option>Computer Science Engineering</option>
                        <option>Information Technology</option>
                        <option>Electronics and Communication</option>
                        <option>Electrical and Electronics</option>
                        <option>Mechanical Engineering</option>
                        <option>Civil Engineering</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="event">Choose an Event <span>*</span></label>
                    <select id="event" name="event" required>
                        <option value="">Select an event</option>
                        <option>Tech Fest 2026</option>
                        <option>Cultural Day</option>
                        <option>Sports Meet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Preferred Date <span>*</span></label>
                    <input type="date" id="date" name="date" required>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message (Optional)</label>
                <textarea id="message" name="message" placeholder="Any additional information..." rows="3"></textarea>
            </div>

            <div class="form-group agreement">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">
                    I agree to the
                    <a href="event-details.html">event rules and regulations</a>.
                </label>
            </div>

            <button type="submit" class="register-submit">
                Register
            </button>
            <p id="form-message" role="status"></p>

        </form>
    </main>

    <footer class="footer">
        <h3><i class="bi bi-mortarboard-fill"></i> Know A Fest</h3>

        <p>Bringing students together through campus activities.</p>

        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
        </div>

        <div class="social">
            <a href="#" aria-label="Instagram">
                <i class="bi bi-instagram"></i>
            </a>
            <a href="#" aria-label="Facebook">
                <i class="bi bi-facebook"></i>
            </a>
            <a href="#" aria-label="LinkedIn">
                <i class="bi bi-linkedin"></i>
            </a>
        </div>

        <p class="copyright">
            &copy; 2026 Know A Fest. All rights reserved.
        </p>
    </footer>
    <script>
        const form = document.querySelector(".register-form");
        const dateInput = document.querySelector("#date");
        const message = document.querySelector("#form-message");

        const today = new Date().toISOString().split("T")[0];
        dateInput.min = today;

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            message.textContent = "Registration successful! We will contact you soon.";
            message.style.color = "#176B45";
            message.style.fontWeight = "bold";

            form.reset();
        });
    </script>
</body>

</html>
