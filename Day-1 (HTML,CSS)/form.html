<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form controls</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <main>
        <h1 class="heading">HTML Form Control</h1>
        <form action="/preferences" method="post">
            <table >
                <tbody>
                <tr>
                    <td><label for="fullname">FullName</label></td>
                    <td><p>:</p></td>
                    <td><input type="text" id="fullname" minlength="2" maxlength="15" required placeholder="Enter Your name"></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td>:</td>
                    <td><input type="email" required id="email" name="email" placeholder="Enter the email"></td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td>:</td>
                    <td><input type="password" required id="password" name="password" minlength="8" maxlength="10"></td>
                </tr>
                <tr>
                    <td><label for="phone">Phone Number:</label></td>
                    <td>:</td>
                    <td><input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="enter a 10-digit Number"></td>
                </tr>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>:</td>
                    <td><input type="date" id="dob" name="dob" required></td>
                </tr>
                <tr>
                    <td><label for="course">preferred course</label></td>
                    <td>:</td>
                    <td>
                        <select name="course" id="course" required>
                            <option value="">Choose a course</option>
                            <option value="html">HTML &amp CSS</option>
                            <option value="js">Javascript</option>
                            <option value="Frontend">Frontend Development</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="bio">About You:</label></td>
                    <td>:</td>
                    <td><textarea name="bio" id="bio" placeholder="Tell us about yourself" rows="4" maxlength="200"></textarea></td>
                </tr>
                <tr>
                    <td><label for="resume">Resume(PDF)</label></td>
                    <td>:</td>
                    <td><input type="file" id="resume" name="resume" accept=".pdf,application/pdf" required></td>
                </tr>
                <tr>
                    <td></td>
                </tr>
                </tbody>

            </table>
            

            <fieldset>
                <legend>Terms and Conditions</legend>
                <label for="terms">
                    <input type="checkbox" id="terms" name="terms" value="accepted" required>
                    I agree to the terms and conditions
                </label>
            </fieldset>
            <br><br>

            <fieldset>
                <legend>Select Your skills</legend>
                <label for="skill-html">
                    <input type="checkbox" id="skill-html" name="skills" value="html">
                    HTML
                </label>
                <label for="skill-css">
                    <input type="checkbox" id="skill-css" name="skills" value="css">
                    CSS
                </label>
                <label for="skill-js">
                    <input type="checkbox" id="skill-js" name="skills" value="js">
                    Javascript
                </label>
            </fieldset>
            <br><br>

            <fieldset>
                <legend>Experience Level</legend>
                <label for="level-beginner">
                    <input type="radio" id="level-beginner" name="level" value="beginner" required>
                    Beginner
                </label>
                <label for="level-intermediate">
                    <input type="radio" id="level-intermediate" name="level" value="intermediate" required>
                    Intermediate
                </label>
                <label for="level-advanced">
                    <input type="radio" id="level-advanced" name="level" value="advanced" required>
                    Advanced
                </label>
            </fieldset>
            <br><br>

            <button type="submit">Create Account</button>
            <button type="reset">Clear Form</button>
        </form>
    </main>
</body>

</html>
